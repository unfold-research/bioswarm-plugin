name: leak-check
# Required on main. Blocks secrets, personal data, private references and non-noreply commit identities.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Files
        run: node scripts/leak-check.mjs
      - name: Commit identities
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/leak-check.mjs --authors "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            node scripts/leak-check.mjs --authors "HEAD"
          fi
      - name: Secrets in history (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gl.tgz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1
